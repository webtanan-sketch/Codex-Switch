name: Prepare stable draft release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag matching all package versions (for example v0.1.3)'
        required: true
        type: string
permissions:
  contents: write
jobs:
  draft:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check release version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $expected = 'v' + (Get-Content package.json | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne $expected) { throw 'Release tag does not match package version.' }
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --exclude codex-account-manager --all-targets --locked -- -D warnings
      - run: ./installer/build.ps1
      - run: ./scripts/release.ps1
      - name: Create stable draft for maintainer review
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Codex Account Manager ${{ inputs.tag }}
          draft: true
          prerelease: false
          generate_release_notes: false
          files: release-artifacts/${{ inputs.tag }}/*
          body_path: docs/release-${{ inputs.tag }}.md
